# SQLite development profile for local demos
spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Use no automatic JPA DDL here (we manage schema via custom DB managers)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Disable remote DB configs when using this profile
# (The legacy DB managers will create tables if missing)
